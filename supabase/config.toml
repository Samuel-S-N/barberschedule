project_id = "zenc"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false
port = 55429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Password-recovery redirects: web dev origins, the app scheme, and Expo Go. The local auth rejects an exp:// URL whose host is a
# bare IP (Expo Go on the LAN), so that case is not covered here.
additional_redirect_urls = ["https://127.0.0.1:3000", "http://127.0.0.1:4173/**", "http://localhost:4173/**", "http://127.0.0.1:8081/**", "http://localhost:8081/**", "http://*.localhost:8081/**", "http://*.localhost:4173/**", "https://*.zencpro.app/**", "zenc://**", "exp://**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
# Same minimum as the signup and password screens; without it the API accepts 6 characters.
minimum_password_length = 8
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.email.template.confirmation]
subject = "Confirme seu e-mail na Zenc"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha da Zenc"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail na Zenc"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Você foi convidado para {{ .Data.business_name }} na Zenc"
content_path = "./supabase/templates/invite.html"

[auth.sms]
enable_signup = false
enable_confirmations = true

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental]
orioledb_version = ""

# dispatch-notifications authenticates itself (service-role key or DISPATCH_TOKEN); the cron token is not a JWT, so the gateway must not check it.
[functions.dispatch-notifications]
verify_jwt = false

# Hosted overrides. `supabase config push --project-ref <ref>` applies the block whose project_id matches; everything not listed
# here keeps the local value above. Without these blocks a push would set site_url to 127.0.0.1 and turn e-mail confirmations off.
# FILL IN (owner): the dev project ref (Project Settings > General, 20 letters) and the account part of the workers.dev address
# (Cloudflare > Workers & Pages > Account details). The deploy workflow refuses to run while a placeholder is left.
[remotes.dev]
project_id = "aaaaaaaaaaaaaaaaaaaa"

[remotes.dev.auth]
site_url = "https://zenc-web-dev.REPLACE-ACCOUNT.workers.dev"
additional_redirect_urls = ["https://zenc-web-dev.REPLACE-ACCOUNT.workers.dev/**"]

[remotes.dev.auth.email]
enable_confirmations = true

[remotes.dev.auth.email.smtp]
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "nao-responda@zencpro.com.br"
sender_name = "Zenc"

# The cron job of migration 0083 reads these two Vault secrets (applied by `db push`, skipped with --skip-vault).
[remotes.dev.db.vault]
dispatch_url = "env(DISPATCH_URL)"
dispatch_token = "env(DISPATCH_TOKEN)"
