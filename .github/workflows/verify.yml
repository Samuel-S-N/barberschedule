name: verify

# Runs on pull requests and when deploy.yml calls it for a merge to main (so a merge is verified once, not twice).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1

      - run: npm ci
      - run: npx supabase start
      - run: npm run verify
